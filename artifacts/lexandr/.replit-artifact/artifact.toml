kind = "web"
previewPath = "/"
title = "LEXANDR — Deep Research Intelligence"
version = "1.0.0"
id = "artifacts/lexandr"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21015

[services.development]
run = "pnpm --filter @workspace/lexandr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lexandr", "run", "build" ]
publicDir = "artifacts/lexandr/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21015"
BASE_PATH = "/"
